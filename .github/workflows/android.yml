name: build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android demo APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch models + sherpa-onnx AAR
        run: android/fetch_models.sh
      - name: Core unit tests (JVM)
        working-directory: android/wakeword-core
        run: ../gradlew test --console=plain
      - name: Build demo APK
        working-directory: android
        run: ./gradlew :demo-app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: wakeword-demo-apk
          path: android/demo-app/build/outputs/apk/debug/demo-app-debug.apk
          if-no-files-found: error

  davoice:
    name: DaVoice demo APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch DaVoice SDK + demo models
        run: android/fetch_davoice.sh
      - name: Build DaVoice demo APK
        working-directory: android
        # Optional repo secret: bakes a default licence key into the APK (users can still paste one).
        env:
          DAVOICE_LICENSE: ${{ secrets.DAVOICE_LICENSE }}
        run: ./gradlew :davoice-demo:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: davoice-demo-apk
          path: android/davoice-demo/build/outputs/apk/debug/davoice-demo-debug.apk
          if-no-files-found: error

  emulator:
    name: On-device tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Fetch models + sherpa-onnx AAR
        run: android/fetch_models.sh
      - name: Instrumented tests on API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          working-directory: android
          script: ./gradlew :demo-app:connectedDebugAndroidTest -PemulatorAbi --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-report
          path: android/demo-app/build/reports/androidTests/
          if-no-files-found: ignore

  python:
    name: Python engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r python/requirements.txt
      - name: pytest (downloads ~20 MB of models)
        working-directory: python
        run: python -m pytest tests -q
